<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Эвия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: архивный кодекс — узкая колонка оглавления слева, лист статьи справа; кванты фактов как строки реестра с меткой видимости на полях. */
:root{
  --paper:#E9ECE7; --sheet:#F8F9F6; --ink:#1C2430; --muted:#5D6672; --line:#CBD1CA;
  --verd:#1D7466; --verd-soft:#DCEDE8; --secret:#8C2D4E; --secret-soft:#F4E7EC; --brass:#8A6B2E;
  --shadow:0 1px 0 rgba(28,36,48,.06),0 8px 24px -16px rgba(28,36,48,.35);
  --f-display:"Forum","Literata",Georgia,serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --side:290px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11151B; --sheet:#171D25; --ink:#E2E5E0; --muted:#9AA2AA; --line:#2B333D;
  --verd:#56BCA8; --verd-soft:#173430; --secret:#E486A4; --secret-soft:#2C1922; --brass:#CDAA62;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 30px -18px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151B; --sheet:#171D25; --ink:#E2E5E0; --muted:#9AA2AA; --line:#2B333D;
  --verd:#56BCA8; --verd-soft:#173430; --secret:#E486A4; --secret-soft:#2C1922; --brass:#CDAA62;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 30px -18px rgba(0,0,0,.8); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sheet)}
a{color:var(--verd);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--verd);outline-offset:2px;border-radius:4px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
textarea{width:100%;min-height:90px;resize:vertical;line-height:1.5}
.mono{font-family:var(--f-mono);font-size:.82em;letter-spacing:.01em}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font:400 26px/1 var(--f-display);letter-spacing:.04em;white-space:nowrap;color:var(--ink)}
.brand small{display:block;font:500 10px/1.2 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.search{flex:1;min-width:0;max-width:440px;margin-left:auto}
.search input{width:100%;border-radius:999px;padding:7px 14px}
.modes{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.modes button{padding:6px 12px;font-size:13px;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.menu-btn,.burger{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);flex:none}
.burger{display:none}
.menu{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:58px;background:var(--sheet);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:260px;z-index:40}
.menu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:6px;font-size:14px}
.menu button:hover{background:var(--paper)}
.menu .note{font-size:12px;color:var(--muted);padding:6px 10px}

/* shell */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:calc(100% - 60px)}
nav.side{border-right:1px solid var(--line);padding:18px 14px 40px max(16px,env(safe-area-inset-left,0px));position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);height:calc(100vh - 58px);overflow:auto;font-size:14px}
.side h4{font:500 11px/1.2 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.side h5{font:italic 400 13px/1.3 var(--f-body);color:var(--muted);margin:10px 0 2px 2px;display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px}
.side h5 .pg{font:500 10px/1.3 var(--f-mono);font-style:normal;color:var(--secret);letter-spacing:.02em}
.side h5 .gbtn{width:20px;height:20px;opacity:.55}.side h5:hover .gbtn,.side h5 .gbtn:focus{opacity:1}
.leak{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;background:var(--sheet)}
.leak .where{font:500 11px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.leak mark{background:var(--secret-soft);color:var(--secret);padding:0 2px;border-radius:2px}
.leakbadge{display:inline-block;margin-top:10px;color:var(--secret);font-size:14px}
.ph-note{font:500 11px/1.2 var(--f-mono);color:var(--secret);margin-left:8px;white-space:nowrap}
.side ul{list-style:none;margin:0;padding:0}
.side li a{display:flex;align-items:center;gap:8px;padding:3px 6px;border-radius:5px;color:var(--ink)}
.side li a:hover{background:var(--sheet);text-decoration:none}
.side li a[aria-current="page"]{background:var(--ink);color:var(--sheet)}
.dot{width:7px;height:7px;border-radius:50%;flex:none;border:1.5px solid var(--secret)}
.dot.on{background:var(--verd);border-color:var(--verd)}
.side .navtop a{font-weight:600}
.side .newbtn{margin-top:18px;font-size:13px;color:var(--verd)}
main{padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.page{max-width:780px;margin:0 auto}

/* article */
.crumb{font:500 11px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1.title{font:400 clamp(34px,5vw,50px)/1.05 var(--f-display);margin:8px 0 12px;text-wrap:balance;letter-spacing:.01em}
.names{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 10px 2px 4px;font-size:13px;background:var(--sheet)}
.chip.closed{border-style:dashed;border-color:var(--secret);background:var(--secret-soft)}
.chip.plain{padding:2px 10px}
.lead{font-size:19px;line-height:1.5;color:var(--ink);margin:4px 0 22px}
section.sec{margin:30px 0 0}
section.sec>h2{font:400 26px/1.15 var(--f-display);margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px}
section.sec>h2 .h{flex:1}
.q{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:6px;align-items:start;padding:5px 6px 5px 0;border-radius:6px;position:relative}
.q+.q{margin-top:2px}
.q .qt{padding-top:1px}
.q .qt p{margin:0}
.q.closed{background:var(--secret-soft)}
.q.closed .qt{color:color-mix(in srgb,var(--ink) 88%,var(--secret))}
.q.player{grid-template-columns:14px minmax(0,1fr);padding-left:0}
.q.player::before{content:"";width:5px;height:5px;margin-top:11px;margin-left:3px;background:var(--brass);transform:rotate(45deg)}
.q.new .qt::after{content:"новое";font:500 10px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--verd);border:1px solid var(--verd);border-radius:3px;padding:2px 4px;margin-left:8px;vertical-align:2px}
.eye{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--secret)}
.eye.on{color:var(--verd)}
.eye:hover{background:var(--sheet)}
.eye.sm{width:22px;height:22px}
.qtools{display:flex;gap:2px;opacity:0;transition:opacity .12s}
.q:hover .qtools,.q:focus-within .qtools{opacity:1}
@media (hover:none){.qtools{opacity:.7}}
.tool{width:26px;height:26px;border-radius:5px;display:grid;place-items:center;color:var(--muted)}
.tool:hover{background:var(--sheet);color:var(--ink)}
.lk{border-bottom:1px solid color-mix(in srgb,var(--verd) 40%,transparent)}
.lk:hover{text-decoration:none;border-bottom-color:var(--verd)}
.lk.hid{color:var(--secret);border-bottom-style:dashed;border-bottom-color:var(--secret)}
.lk.missing{color:var(--muted);border-bottom:1px dotted var(--muted)}
.addrow{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 0 34px}
.addrow button,.textbtn{font-size:13px;color:var(--verd)}
.secbtns{display:flex;gap:2px;font-size:12px}
.secbtns .tool{width:auto;padding:0 6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.04em}

.editor{display:grid;gap:8px}
.editor .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);border-radius:6px;padding:5px 12px;font-size:14px;background:var(--sheet)}
.btn.pri{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.hint{font-size:12px;color:var(--muted)}
.picker{border:1px solid var(--line);border-radius:8px;background:var(--sheet);max-height:220px;overflow:auto}
.picker button{display:block;width:100%;text-align:left;padding:5px 10px;font-size:14px}
.picker button:hover{background:var(--paper)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--sheet);margin:4px 0}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:500 11px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--paper);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.grp{font:500 11px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--brass);background:var(--paper)}
.tfilter{margin:4px 0 8px;width:100%;max-width:320px}

/* gallery */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:6px 0 10px}
figure.img{margin:0;border:1px solid var(--line);border-radius:8px;background:var(--sheet);overflow:hidden;display:flex;flex-direction:column}
figure.img.closed{border:1px dashed var(--secret)}
figure.img .ph{aspect-ratio:4/3;background:var(--paper);display:grid;place-items:center;overflow:hidden;cursor:zoom-in}
figure.img img{width:100%;height:100%;object-fit:cover;display:block}
figure.img figcaption{font-size:12px;color:var(--muted);padding:6px 8px;display:flex;gap:4px;align-items:flex-start}
figure.img figcaption span{flex:1;min-width:0}
[hidden]{display:none!important}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(10,12,16,.82);display:grid;place-items:center;padding:24px}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px;background:#fff}

/* backlinks */
.back{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);font-size:14px}
.back h3{font:500 11px/1.2 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.back ul{display:flex;flex-wrap:wrap;gap:6px 14px;list-style:none;margin:0;padding:0}
.gmfoot{margin-top:28px;display:flex;gap:16px;flex-wrap:wrap;font-size:13px}
.danger{color:var(--secret)}

/* home */
.hero h1{font:400 clamp(40px,7vw,68px)/1 var(--f-display);margin:6px 0 10px;letter-spacing:.02em}
.hero p{max-width:60ch;color:var(--muted);margin:0}
.stats{display:flex;flex-wrap:wrap;gap:28px;margin:24px 0 8px}
.stat b{display:block;font:400 34px/1 var(--f-display)}
.stat span{font:500 11px/1.4 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--secret-soft);overflow:hidden;max-width:420px;margin-top:6px}
.bar i{display:block;height:100%;background:var(--verd)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:28px}
.cat{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.cat h3{font:400 22px/1.1 var(--f-display);margin:0 0 6px}
.cat p{margin:0;font-size:13px;color:var(--muted)}
.cat ul{list-style:none;padding:0;margin:8px 0 0;font-size:14px;line-height:1.5}
.recent{margin-top:34px}
.recent h2{font:400 26px/1.1 var(--f-display);margin:0 0 10px}
.recent li{margin-bottom:8px}
.recent ul{padding-left:18px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:14px}
.legend span{display:inline-flex;gap:6px;align-items:center}

/* timeline */
.tl-filters{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 22px}
.fchip{border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:13px;background:var(--sheet)}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.era{font:400 24px/1.1 var(--f-display);margin:30px 0 8px;color:var(--brass)}
.ev{display:grid;grid-template-columns:132px minmax(0,1fr);gap:16px;padding:10px 0;border-top:1px solid var(--line)}
.ev .when{font-family:var(--f-mono);font-size:13px;line-height:1.35}
.ev .when b{display:block;font-weight:500;font-size:15px}
.ev .when i{font-style:normal;color:var(--muted)}
.ev .when em{display:block;font-style:normal;color:var(--brass);font-size:12px}
.ev .body{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:6px;align-items:start;border-radius:6px}
.ev.player .body{grid-template-columns:minmax(0,1fr)}
.ev.closed .body{background:var(--secret-soft)}
.ev:hover .qtools{opacity:1}
.evform{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.evform label{display:grid;gap:2px;font-size:12px;color:var(--muted)}

.empty{padding:40px 0;color:var(--muted)}
.wip{margin-top:24px;padding:28px;border:1px dashed var(--line,#999);border-radius:10px;color:var(--muted)}
.wip b{display:inline-block;font-family:var(--f-mono);letter-spacing:.12em;font-size:12px;padding:3px 8px;border:1px solid currentColor;border-radius:4px;margin-bottom:10px}
.wip p{margin:0}
.gl .page{max-width:none}
.gl-tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.gl-tools input#glq{flex:1;min-width:200px;max-width:360px}
.gl-t td{padding:2px 4px}
.gl-t th:nth-child(1),.gl-t th:nth-child(2){width:32%}
.gl-t input{width:100%;border:1px solid transparent;background:transparent;padding:5px 6px;border-radius:4px;font-size:14px}
.gl-t input:hover{border-color:var(--line)}
.gl-t input:focus{border-color:var(--verd);background:var(--sheet)}
.gl-t td:nth-child(1) input{font-weight:600}
.gl-t tr.gl-miss td:nth-child(2) input{background:var(--secret-soft)}
.gl-t tr.gl-closed td:nth-child(1) input{color:var(--muted)}
.gl-act{white-space:nowrap;width:1%}
.gl-act .eye,.gl-act .tool{display:inline-grid}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--muted);font-style:italic}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:8px;font-size:14px;z-index:70;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast button{color:var(--verd-soft);text-decoration:underline}
.syncpill{font:500 11px/1 var(--f-mono);letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.newform{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:10px;max-width:480px}
.newform label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.results li{margin-bottom:12px}
.results .snip{font-size:14px;color:var(--muted)}
mark{background:var(--verd-soft);color:inherit;border-radius:2px;padding:0 1px}

.qadd-btn{flex:none;border-radius:999px;font-size:13px;padding:6px 12px}
.suggest{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:28px;padding-top:14px;border-top:1px solid var(--line)}
.inbox-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;background:var(--sheet);display:grid;gap:8px}
.inbox-card.done{opacity:.6}
.inbox-card .meta{font:500 12px/1.4 var(--f-mono);color:var(--muted)}
.inbox-card textarea{width:100%;min-height:70px;font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.inbox-card .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inbox-card blockquote{margin:0;padding-left:10px;border-left:2px solid var(--line);color:var(--muted);font-size:14px}
.qa-modal{position:fixed;inset:0;z-index:65;background:rgba(10,12,16,.45);display:grid;place-items:start center;padding:8vh 16px 16px;overflow:auto}
.qa-box{background:var(--sheet);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:min(560px,100%);padding:16px 18px;display:grid;gap:12px}
.qa-head{display:flex;align-items:center;justify-content:space-between}
.qa-head h2{font:400 26px/1 var(--f-display);margin:0}
.qa-tabs{display:flex;gap:6px}
.qa-l{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.qa-l input,.qa-l select{color:var(--ink);font-size:15px}
.qa-row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.qa-row input{flex:1;min-width:0}
.qa-opts .qa-l{flex:1;min-width:120px}
.qa-chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);padding-bottom:8px}
.qa-vars{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.qa-var{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.qa-var button{padding:4px 10px;font-size:14px}
.qa-var button:hover{background:var(--verd-soft)}
.qa-var .qa-star{padding:4px 8px;border-left:1px solid var(--line);color:var(--brass)}
.qa-links{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.qa-links input{flex:1;min-width:180px}
.qa-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.side{position:fixed;left:0;top:calc(env(safe-area-inset-top,0px) + 58px);bottom:0;height:auto;width:min(86vw,320px);background:var(--paper);z-index:25;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow)}
  nav.side.open{transform:none}
  .burger{display:grid}
  .brand small{display:none}
  .modes button{padding:6px 9px}
  .ev{grid-template-columns:minmax(0,1fr);gap:4px}
}
@media (max-width:560px){
  .top{flex-wrap:wrap}
  .search{order:5;flex-basis:100%;max-width:none}
  .menu{top:100px}
  nav.side{top:calc(env(safe-area-inset-top,0px) + 104px)}
  .syncpill{display:none}
  .q,.ev .body{grid-template-columns:24px minmax(0,1fr)}
  .q.player{grid-template-columns:14px minmax(0,1fr)}
  .qtools{grid-column:2;justify-content:flex-end;margin-top:-4px}
  section.sec>h2{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>window.EVIA_MODE="player";</script>
<script>
/* Эвия — хранилище на GitHub. Подменяет window.claude: данные живут в браузере (IndexedDB)
   и синхронизируются с репозиториями по кнопке. Режим задаёт window.EVIA_MODE: "gm" или "player". */
(function(){
"use strict";
const CFG={owner:"dariasavchenko-esl",gmRepo:"aevia-gm",pubRepo:"aevia",branch:"main",
  gmPath:"data/gm.json",pubPath:"data/players.json",pages:"https://dariasavchenko-esl.github.io/aevia/"};
const MODE=window.EVIA_MODE||"player";
const API="https://api.github.com";

/* ---------- IndexedDB ---------- */
let idb=null;
function openIdb(){
  return new Promise(res=>{
    try{const r=indexedDB.open("evia-"+MODE,1);
      r.onupgradeneeded=()=>{r.result.createObjectStore("kv");r.result.createObjectStore("img")};
      r.onsuccess=()=>{idb=r.result;res(idb)};r.onerror=()=>res(null);
    }catch(e){res(null)}
  });
}
function idbGet(store,key){return new Promise(res=>{if(!idb) return res(undefined);try{const t=idb.transaction(store).objectStore(store).get(key);t.onsuccess=()=>res(t.result);t.onerror=()=>res(undefined)}catch(e){res(undefined)}})}
function idbPut(store,key,val){return new Promise(res=>{if(!idb) return res();try{const tx=idb.transaction(store,"readwrite");tx.objectStore(store).put(val,key);tx.oncomplete=()=>res();tx.onerror=()=>res()}catch(e){res()}})}
const ready=openIdb();

/* ---------- состояние ---------- */
const st={gm:{},pub:{},tomb:{},base:{},dirty:false,lastSync:0,imgPending:{},imgPushed:{}};
const subs={gm:[],pub:[]};
const clone=o=>JSON.parse(JSON.stringify(o));
function snap(c){return {docs:Object.entries(st[c]).map(([id,v])=>({id,data:()=>clone(v)}))}}
function notify(c){for(const f of subs[c]) try{f(snap(c))}catch(e){console.error(e)}}
let saveT=null;
function persist(){clearTimeout(saveT);saveT=setTimeout(()=>idbPut("kv","state",{gm:st.gm,tomb:st.tomb,base:st.base,dirty:st.dirty,lastSync:st.lastSync,imgPending:st.imgPending,imgPushed:st.imgPushed,pub:MODE==="player"?st.pub:{}}),200)}
async function load(){
  await ready;const s=await idbGet("kv","state");
  if(s){Object.assign(st,{gm:s.gm||{},tomb:s.tomb||{},base:s.base||{},dirty:!!s.dirty,lastSync:s.lastSync||0,imgPending:s.imgPending||{},imgPushed:s.imgPushed||{},pub:s.pub||{}})}
}
const loaded=load();
/* мастер с пустым архивом ждёт первой синхронизации, чтобы не затереть данные заготовками */
let gateOpen=true,openGate=null;const gate=loaded.then(()=>{if(MODE==="gm"&&!Object.keys(st.gm).length){gateOpen=false;return new Promise(r=>{openGate=()=>{gateOpen=true;r()}})}});

/* ---------- токен и GitHub ---------- */
const tokenKey="evia-gh-token";
function token(){try{return localStorage.getItem(tokenKey)||""}catch(e){return ""}}
function setToken(t){try{t?localStorage.setItem(tokenKey,t):localStorage.removeItem(tokenKey)}catch(e){}}
async function gh(path,opt={},raw=false){
  const h={"Accept":raw?"application/vnd.github.raw+json":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  const t=token();if(t) h.Authorization="Bearer "+t;
  if(opt.body) h["Content-Type"]="application/json";
  const r=await fetch(API+path,{...opt,headers:{...h,...(opt.headers||{})},cache:"no-store"});
  return r;
}
function b64(str){const bytes=new TextEncoder().encode(str);let s="";for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s)}
async function blobB64(blob){const buf=new Uint8Array(await blob.arrayBuffer());let s="";for(let i=0;i<buf.length;i+=0x8000) s+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));return btoa(s)}
async function getSha(repo,path){
  const r=await gh(`/repos/${CFG.owner}/${repo}/contents/${path}?ref=${CFG.branch}`);
  if(r.status===404) return null;
  if(!r.ok) throw httpErr(r);
  const j=await r.json();return j.sha;
}
async function readRaw(repo,path){
  const r=await gh(`/repos/${CFG.owner}/${repo}/contents/${path}?ref=${CFG.branch}&t=${Date.now()}`,{},true);
  if(r.status===404) return null;
  if(!r.ok) throw httpErr(r);
  return r;
}
async function putFile(repo,path,contentB64,message,sha){
  const body={message,content:contentB64,branch:CFG.branch};if(sha) body.sha=sha;
  const r=await gh(`/repos/${CFG.owner}/${repo}/contents/${path}`,{method:"PUT",body:JSON.stringify(body)});
  if(!r.ok) throw httpErr(r);
  return (await r.json()).content.sha;
}
function httpErr(r){const e=new Error("HTTP "+r.status);e.status=r.status;return e}
function errText(e){
  if(!e) return "неизвестная ошибка";
  if(e.status===401) return "токен не подошёл — проверьте его в настройках синхронизации";
  if(e.status===403) return "GitHub отказал в доступе (токен без прав на запись или лимит запросов)";
  if(e.status===404) return "репозиторий не найден или токен его не видит";
  if(e.status===409) return "файл изменился во время синхронизации — нажмите ещё раз";
  if(e.status===422) return "GitHub отклонил запись";
  if(e instanceof TypeError) return "нет связи с GitHub — проверьте интернет";
  return e.message||String(e);
}

/* ---------- картинки ---------- */
const urls={};const loading={};
function imgSrc(asset){
  if(!asset) return "";
  if(urls[asset]) return urls[asset];
  if(!loading[asset]) loading[asset]=loadImg(asset);
  return "data:image/gif;base64,R0lGODlhAQABAAAAACw=";
}
async function loadImg(asset){
  await ready;
  let blob=await idbGet("img",asset);
  if(!blob){
    try{
      if(MODE==="gm"&&token()){const r=await readRaw(CFG.gmRepo,"img/"+asset);if(r) blob=await r.blob()}
      if(!blob){const r=await fetch(CFG.pages+"img/"+asset).catch(()=>null);if(r&&r.ok) blob=await r.blob()}
      if(!blob){const r=await readRaw(CFG.pubRepo,"img/"+asset).catch(()=>null);if(r) blob=await r.blob()}
      if(blob) await idbPut("img",asset,blob);
    }catch(e){}
  }
  if(blob){urls[asset]=URL.createObjectURL(blob);rerender()}
}
let rrT=null;function rerender(){clearTimeout(rrT);rrT=setTimeout(()=>{if(window.__evia&&window.__evia.renderMain) window.__evia.renderMain()},50)}

/* ---------- API, как у claude ---------- */
function collection(c){
  return {
    onSnapshot(cb){subs[c].push(cb);gate.then(()=>cb(snap(c)));return ()=>{subs[c]=subs[c].filter(f=>f!==cb)}},
    async get(){await loaded;return snap(c)},
    doc(id){return {
      async set(v){
        await loaded;
        if(MODE!=="gm"||!gateOpen) return;
        if(c==="pub"){st.pub[id]=clone(v);return}
        const d=clone(v);if(id==="_timeline") d.updated=Date.now();
        st.gm[id]=d;delete st.tomb[id];st.dirty=true;persist();notify("gm");status();
      },
      async delete(){
        await loaded;
        if(MODE!=="gm"||!gateOpen) return;
        if(c==="pub"){delete st.pub[id];return}
        delete st.gm[id];st.tomb[id]=Date.now();st.dirty=true;persist();notify("gm");status();
      }
    }}
  };
}
const db={collection};
const assets={async upload(file){
  await ready;const id=Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,"0")).join("");
  await idbPut("img",id,file);urls[id]=URL.createObjectURL(file);st.imgPending[id]=1;st.dirty=true;persist();status();
  return {id};
}};
const downloads={async save({filename,data}){
  const blob=data instanceof Blob?data:new Blob([data],{type:/\.html?$/.test(filename)?"text/html":"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}};
window.claude={use:async name=>{
  if(name==="user") return {canEdit:async()=>MODE==="gm"};
  if(name==="db") return db;
  if(name==="assets") return MODE==="gm"?assets:null;
  if(name==="downloads") return downloads;
  return null;
}};
window.__imgSrc=imgSrc;

/* ---------- синхронизация мастера ---------- */
function mergeDocs(local,remote,tl,tr,base){
  const out={},tomb={...tr};
  for(const [k,v] of Object.entries(tl)) tomb[k]=Math.max(tomb[k]||0,v);
  const ids=new Set([...Object.keys(local),...Object.keys(remote)]);
  let conflicts=0;
  for(const id of ids){
    const L=local[id],R=remote[id];
    let pick=!L?R:!R?L:((L.updated||0)>=(R.updated||0)?L:R);
    if(L&&R&&base[id]!=null&&(L.updated||0)!==base[id]&&(R.updated||0)!==base[id]&&JSON.stringify(L)!==JSON.stringify(R)) conflicts++;
    if(pick&&tomb[id]&&tomb[id]>(pick.updated||0)) pick=null;
    if(pick) out[id]=pick;
  }
  return {docs:out,tomb,conflicts};
}
function buildPub(docs){
  const E=window.__evia;const m=new Map();
  for(const [id,v] of Object.entries(docs)) if(id!=="_timeline") m.set(id,v);
  const vis=E.visSet(m);const arts=[];
  for(const a of m.values()){const p=E.pubOf(a,vis,m);if(p) arts.push(p)}
  const tl=E.pubTimeline(docs._timeline||{events:[]},vis,m);
  return {savedAt:new Date().toISOString(),articles:arts,timeline:tl};
}
let syncing=false;
async function syncGm(){
  if(syncing) return;
  if(!token()){openSettings();return}
  if(!navigator.onLine){status("нет интернета");return}
  syncing=true;status("синхронизирую…");
  try{
    await loaded;
    for(let attempt=0;attempt<2;attempt++){
      // 1. скачать архив
      let remote={docs:{},tomb:{}},sha=null;
      const r=await readRaw(CFG.gmRepo,CFG.gmPath);
      if(r){remote=await r.json();sha=await getSha(CFG.gmRepo,CFG.gmPath)}
      if(!r&&!Object.keys(st.gm).length){status();toast("В закрытом репозитории нет архива (data/gm.json) — загрузите его туда, потом синхронизируйте.");return}
      // 2. слить
      const m=mergeDocs(st.gm,remote.docs||{},st.tomb,remote.tomb||{},st.base);
      if(!Object.keys(m.docs).length) throw new Error("архив получился пустым — синхронизация остановлена, ничего не записано");
      // 3. картинки мастера
      for(const id of Object.keys(st.imgPending)){
        const blob=await idbGet("img",id);if(!blob){delete st.imgPending[id];continue}
        const s=await getSha(CFG.gmRepo,"img/"+id);
        if(!s) await putFile(CFG.gmRepo,"img/"+id,await blobB64(blob),"Картинка "+id);
        delete st.imgPending[id];persist();
      }
      // 4. записать архив
      const payload={savedAt:new Date().toISOString(),docs:m.docs,tomb:m.tomb};
      try{
        await putFile(CFG.gmRepo,CFG.gmPath,b64(JSON.stringify(payload)),"Архив мастера · "+new Date().toLocaleString("ru-RU"),sha);
      }catch(e){if(e.status===409&&attempt===0) continue;throw e}
      st.gm=m.docs;st.tomb=m.tomb;st.base=Object.fromEntries(Object.entries(m.docs).map(([k,v])=>[k,v.updated||0]));
      // 5. версия для игроков и открытые картинки
      const pub=buildPub(m.docs);
      const openImgs=new Set(pub.articles.flatMap(a=>(a.images||[]).map(i=>i.asset)));
      for(const id of openImgs){
        if(st.imgPushed[id]) continue;
        let blob=await idbGet("img",id);
        if(!blob){const rr=await readRaw(CFG.gmRepo,"img/"+id);if(rr){blob=await rr.blob();await idbPut("img",id,blob)}}
        if(!blob) continue;
        const s=await getSha(CFG.pubRepo,"img/"+id);
        if(!s) await putFile(CFG.pubRepo,"img/"+id,await blobB64(blob),"Открыта картинка "+id);
        st.imgPushed[id]=1;persist();
      }
      const psha=await getSha(CFG.pubRepo,CFG.pubPath);
      await putFile(CFG.pubRepo,CFG.pubPath,b64(JSON.stringify(pub)),"Версия для игроков · "+new Date().toLocaleString("ru-RU"),psha);
      st.dirty=false;st.lastSync=Date.now();persist();if(openGate){openGate();openGate=null}else notify("gm");
      status();toast("Синхронизировано. Статей в архиве: "+Object.keys(m.docs).filter(k=>k!=="_timeline").length+", открыто игрокам: "+pub.articles.length+"."+(m.conflicts?" Правки с двух устройств в "+m.conflicts+" статьях — взята более свежая версия.":""));
      break;
    }
  }catch(e){console.error(e);status("ошибка");toast("Синхронизация не удалась: "+errText(e)+".")}
  finally{syncing=false;status()}
}

/* ---------- синхронизация игрока ---------- */
async function syncPlayer(quiet){
  if(syncing) return;syncing=true;status("обновляю…");
  try{
    await loaded;
    let data=null;
    try{const r=await gh(`/repos/${CFG.owner}/${CFG.pubRepo}/contents/${CFG.pubPath}?ref=${CFG.branch}&t=${Date.now()}`,{},true);if(r.ok) data=await r.json()}catch(e){}
    if(!data){const r=await fetch(CFG.pages+CFG.pubPath+"?t="+Date.now(),{cache:"no-store"});if(r.ok) data=await r.json()}
    if(!data) throw new Error("no data");
    st.pub={};for(const a of data.articles||[]) st.pub[a.id]=a;st.pub._timeline=data.timeline||{events:[]};
    st.lastSync=Date.now();persist();notify("pub");status();
    if(!quiet) toast("Обновлено: "+(data.articles||[]).length+" статей.");
  }catch(e){console.error(e);status(Object.keys(st.pub).length?"офлайн-копия":"нет связи");if(!quiet) toast("Не удалось обновить — показываю сохранённую копию.")}
  finally{syncing=false;status()}
}

/* ---------- интерфейс ---------- */
function toast(t){if(window.__evia&&window.__evia.toast) window.__evia.toast(t);else alert(t)}
function ago(ts){if(!ts) return "ещё не синхронизировано";const m=Math.round((Date.now()-ts)/60000);return m<1?"только что":m<60?m+" мин назад":new Date(ts).toLocaleString("ru-RU",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}
let statusText="";
function status(t){
  if(t!==undefined) statusText=t;
  const el=document.getElementById("gh-status");if(!el) return;
  const busy=syncing;
  el.textContent=statusText&&busy?statusText:(MODE==="gm"&&st.dirty?"есть несохранённые правки":ago(st.lastSync));
  el.classList.toggle("warn",MODE==="gm"&&st.dirty&&!busy);
  const b=document.getElementById("gh-sync");if(b) b.disabled=busy;
}
function openSettings(){
  const m=document.getElementById("gh-modal");
  m.innerHTML='<div class="qa-box" role="dialog" aria-modal="true"><div class="qa-head"><h2>Синхронизация с GitHub</h2><button class="tool" data-gh="close" aria-label="Закрыть">✕</button></div>'+
   '<p class="hint" style="margin:0">Архив мастера хранится в закрытом репозитории <b>'+CFG.owner+'/'+CFG.gmRepo+'</b>, версия для игроков — в открытом <b>'+CFG.owner+'/'+CFG.pubRepo+'</b>. Нужен личный токен GitHub (fine-grained) с правом <b>Contents: Read and write</b> на оба репозитория. Токен хранится только в этом браузере.</p>'+
   '<label class="qa-l">Токен<input id="gh-token" type="password" autocomplete="off" value="'+(token()?"••••••••":"")+'" placeholder="github_pat_…"></label>'+
   '<div class="qa-foot"><button class="btn pri" data-gh="save">Сохранить и синхронизировать</button>'+(token()?'<button class="btn" data-gh="forget">Забыть токен</button>':"")+'<button class="btn" data-gh="close">Отмена</button></div></div>';
  m.hidden=false;setTimeout(()=>document.getElementById("gh-token").focus(),30);
}
document.addEventListener("click",e=>{
  if(e.target.id==="gh-modal"){e.target.hidden=true;return}
  const b=e.target.closest("[data-gh]");if(!b) return;
  const m=document.getElementById("gh-modal");
  if(b.dataset.gh==="close") m.hidden=true;
  if(b.dataset.gh==="forget"){setToken("");m.hidden=true;toast("Токен удалён из этого браузера.")}
  if(b.dataset.gh==="save"){const v=document.getElementById("gh-token").value.trim();if(v&&!/^•+$/.test(v)) setToken(v);m.hidden=true;syncGm()}
  if(b.dataset.gh==="sync") MODE==="gm"?syncGm():syncPlayer(false);
  if(b.dataset.gh==="settings"){document.getElementById("menu").hidden=true;openSettings()}
});
function mountUi(){
  const top=document.querySelector(".top");const menuBtn=document.getElementById("menubtn");
  const wrap=document.createElement("div");wrap.className="gh-wrap";
  wrap.innerHTML='<button class="btn gh-btn" id="gh-sync" data-gh="sync" title="'+(MODE==="gm"?"Отправить правки и получить чужие":"Получить свежую версию")+'">⟳ <span class="gh-l">Синхронизировать</span></button><span class="gh-status" id="gh-status"></span>';
  top.insertBefore(wrap,menuBtn);
  const modal=document.createElement("div");modal.id="gh-modal";modal.className="qa-modal";modal.hidden=true;document.body.appendChild(modal);
  const css=document.createElement("style");css.textContent='.gh-wrap{display:flex;align-items:center;gap:8px;flex:none}.gh-btn{border-radius:999px;font-size:13px;padding:6px 12px}.gh-btn:disabled{opacity:.6}.gh-status{font:500 11px/1.2 var(--f-mono);color:var(--muted);max-width:120px}.gh-status.warn{color:var(--secret)}@media (max-width:700px){.gh-l,.gh-status{display:none}}';
  document.head.appendChild(css);
  status();
}
window.__gh={mode:MODE,sync:()=>MODE==="gm"?syncGm():syncPlayer(false),settings:openSettings,cfg:CFG};
document.addEventListener("DOMContentLoaded",()=>{
  mountUi();
  if(MODE==="player") loaded.then(()=>syncPlayer(true));
  if(MODE==="gm") loaded.then(()=>{if(!token()) openSettings();else if(!st.lastSync&&!Object.keys(st.gm).length) syncGm()});
});
window.addEventListener("beforeunload",e=>{if(MODE==="gm"&&st.dirty){e.preventDefault();e.returnValue=""}});
})();

</script>
</head>
<body>


<header class="top">
  <button class="burger" id="burger" aria-label="Оглавление"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 4h14M2 9h14M2 14h14"/></svg></button>
  <a class="brand" href="#home">Эвия<small id="brandsub">архив</small></a>
  <div class="search"><label class="sr" for="q">Поиск</label><input id="q" type="search" placeholder="Поиск по имени, месту, факту…" autocomplete="off"></div>
  <span class="syncpill" id="sync"></span>
  <button class="btn qadd-btn" id="qadd" hidden title="Быстро записать NPC (клавиша N)">+ NPC</button>
  <div class="modes" id="modes" hidden>
    <button id="m-gm" aria-pressed="true">Мастер</button>
    <button id="m-pl" aria-pressed="false">Глазами игрока</button>
  </div>
  <button class="menu-btn" id="menubtn" aria-label="Меню" hidden><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="3" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="8" cy="13" r="1.4"/></svg></button>
</header>
<div id="menu" class="menu" hidden></div>
<div class="shell">
  <nav class="side" id="side" aria-label="Оглавление"></nav>
  <main id="main"><div class="loading">Открываю архив…</div></main>
</div>
<div id="toast" class="toast" hidden></div>
<div id="lightbox" class="lightbox" hidden></div>
<div id="qadd-modal" class="qa-modal" hidden></div>
<input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
<input type="file" id="impfile" accept="application/json,.json" hidden>

<script>
(function(){
"use strict";
const CATS=[["world","Мир и космология"],["gods","Боги и тайны Машины"],["empire","Эвийская империя"],["places","Места"],["peoples","Народы"],["factions","Фракции"],["families","Семьи"],["people","Персонажи"],["plots","Сюжетные линии"],["campaign","Кампания"],["rules","Справочники и механики"],["meta","Служебное"]];
const CATN=Object.fromEntries(CATS);
const ERAS=["До Заветов","Безвременье","Собирание империи","Золотой век","Предыстория кампании","Кампания"];
const NEWMS=1000*60*60*24*14;
const I={
  eye:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8 12.1 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg>',
  lock:'<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 015 0v2"/></svg>',
  pen:'<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 2.5l2.5 2.5L6 12.5H3.5V10z"/></svg>',
  x:'<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg>',
  up:'<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 13V3M4 7l4-4 4 4"/></svg>'
};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const clone=o=>JSON.parse(JSON.stringify(o));

const S={mode:"loading",preview:false,arts:new Map(),tl:{events:[]},pub:new Map(),pubTl:{events:[]},route:{v:"home"},q:"",edit:null,db:null,assets:null,downloads:null,eraF:null,visF:"all",tf:{},pick:null,newArt:false,undo:null,busy:0};

/* ---------- data views ---------- */
function visSet(arts){const s=new Set();for(const a of arts.values()) if((a.names||[]).some(n=>n.o)) s.add(a.id);return s}
function pubTitle(a){const n=(a.names||[]).find(n=>n.o);return n?n.t:""}
function linkFilter(t,vis,arts){
  return String(t||"").replace(/\[\[([a-z0-9_]+)(?:\|([^\]]*))?\]\]/g,(m,id,label)=>{
    if(vis.has(id)) return "[["+id+"|"+(label!=null?label:pubTitle(arts.get(id)))+"]]";
    return label!=null?label:"…";
  });
}
/* скрытые имена: всё, что игроки не должны прочесть в названиях групп, заголовках и текстах */
function normW(w){return w.toLowerCase().replace(/ё/g,"е")}
function stemOf(w){w=normW(w);return w.slice(0,Math.max(4,w.length-(w.length<=6?1:2)))}
function wordsOf(t){return String(t||"").match(/[A-Za-zА-Яа-яЁё][A-Za-zА-Яа-яЁё'’-]*/g)||[]}
function isProper(w){return w.length>=4&&w[0]!==w[0].toLowerCase()&&w[0]===w[0].toUpperCase()}
function hiddenTerms(arts,vis){
  if(vis&&vis._terms) return vis._terms;
  const ign=new Set((S.tl&&S.tl.leakIgnore)||[]);
  const openW=[];
  for(const a of arts.values()) if(vis.has(a.id)) for(const n of a.names) if(n.o) for(const w of wordsOf(n.t)) if(w.length>=4) openW.push(normW(w));
  for(const [,cn] of CATS) for(const w of wordsOf(cn)) if(w.length>=4) openW.push(normW(w));
  const terms=new Map(),idx=new Map();
  for(const a of arts.values()){
    if(a.cat==="meta") continue;
    const hid=vis.has(a.id)?a.names.filter(n=>!n.o):a.names;
    for(const n of hid){
      const ws=wordsOf(n.t.replace(/\([^)]*\)/g,""));const allCap=ws.every(w=>(w[0]!==w[0].toLowerCase())||/^(де|ди|да|ван|фон|аль|ибн|ля|ла|эль|дель|дю)$/i.test(w));
      ws.forEach((w,k)=>{
        if(!isProper(w)) return;
        if(k===0&&!allCap) return;              // «Приём у Элдкарнов», «Среда в бою»: первое слово — не имя
        const strong=ws.length>1||k>0;          // одиночное слово («Отец», «Истина») — только в середине фразы
        const st=stemOf(w);if(ign.has(st)||terms.has(st)) return;
        if(openW.some(o=>o.startsWith(st))) return; // «Тесса» при открытой «Тессаре», «Кейдена» при открытом «Кейдене»
        terms.set(st,{name:n.t,art:a.id,stem:st,strong});const q=st.slice(0,4);if(!idx.has(q)) idx.set(q,[]);idx.get(q).push(st);
      });
    }
  }
  const T={terms,idx};if(vis) vis._terms=T;return T;
}
function leakIn(text,T){
  const p=plain(text),re=/[A-Za-zА-Яа-яЁё][A-Za-zА-Яа-яЁё'’-]*/g;let m;
  while((m=re.exec(p))){
    const w=m[0];if(!isProper(w)) continue;
    const lw=normW(w);const c=T.idx.get(lw.slice(0,4));if(!c) continue;
    for(const st of c){
      if(!(lw.startsWith(st)&&lw.length<=st.length+4)) continue;
      const t=T.terms.get(st);
      if(!t.strong){const before=p.slice(0,m.index).trimEnd();if(!before||/[.!?…«"„“—:(\-]$/.test(before)) continue}
      return {word:w,...t};
    }
  }
  return null;
}
function pubGroup(a,T){
  if(a.pgroup) return a.pgroup==="—"?"":a.pgroup;
  const g=a.group||"";return g&&leakIn(g,T)?"":g;
}
function pubHead(s,T){
  if(s.ph) return s.ph==="—"?"":s.ph;
  return leakIn(s.h,T)?"":s.h;
}
function pubOf(a,vis,arts){
  if(!vis.has(a.id)) return null;
  const tx=t=>linkFilter(t,vis,arts);
  const T=hiddenTerms(arts,vis);
  return {id:a.id,cat:a.cat,group:"",order:0,
    names:a.names.filter(n=>n.o).map(n=>({id:n.id,t:n.t,o:true})),
    lead:a.lead&&a.lead.o?{id:a.lead.id,t:tx(a.lead.t),o:true,ot:a.lead.ot||0}:null,
    sections:a.sections.map(s=>({id:s.id,h:pubHead(s,T),items:s.items.filter(i=>i.o).map(i=>i.table?{id:i.id,table:i.table,o:true,ot:i.ot||0}:{id:i.id,t:tx(i.t),o:true,ot:i.ot||0})})).filter(s=>s.items.length),
    images:(a.images||[]).filter(i=>i.o).map(i=>({id:i.id,asset:i.asset,cap:tx(i.cap||""),o:true}))};
}
function pubTimeline(tl,vis,arts){return {events:(tl.events||[]).filter(e=>e.o).map(e=>({...e,t:linkFilter(e.t,vis,arts)}))}}
function view(){
  if(S.mode==="gm"&&!S.preview) return {arts:S.arts,tl:S.tl,gm:true};
  if(S.mode==="gm"){const vis=visSet(S.arts);const m=new Map();for(const a of S.arts.values()){const p=pubOf(a,vis,S.arts);if(p)m.set(a.id,p)}return {arts:m,tl:pubTimeline(S.tl,vis,S.arts),gm:false}}
  return {arts:S.pub,tl:S.pubTl,gm:false};
}
function title(a,gm){return gm?(a.names[0]?.t||"Без названия"):(pubTitle(a)||"…")}

/* ---------- formatting ---------- */
function fmt(t,D){
  let h=esc(t);
  h=h.replace(/\\\*/g,"&#42;");
  h=h.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  h=h.replace(/\[\[([a-z0-9_]+)(?:\|([^\]]*))?\]\]/g,(m,id,label)=>{
    const a=D.arts.get(id);
    if(!a) return '<span class="lk missing" title="Статья не найдена">'+(label||id)+"</span>";
    const hid=D.gm&&!a.names.some(n=>n.o);
    return '<a class="lk'+(hid?" hid":"")+'" href="#a-'+id.replace(/_/g,"-")+'"'+(hid?' title="Статья скрыта от игроков"':"")+">"+(label||esc(title(a,D.gm)))+"</a>";
  });
  return h;
}
function plain(t){return String(t||"").replace(/\[\[[a-z0-9_]+\|([^\]]*)\]\]/g,"$1").replace(/\[\[([a-z0-9_]+)\]\]/g,"$1").replace(/\*\*/g,"")}

/* ---------- routing ---------- */
function parseHash(){
  const h=location.hash.slice(1);
  if(h.startsWith("a-")) return {v:"art",id:h.slice(2).replace(/-/g,"_")};
  if(h==="timeline") return {v:"tl"};
  if(h==="map") return {v:"map"};
  if(h==="glossary") return {v:"gloss"};
  if(h==="leaks") return {v:"leaks"};
  if(h==="inbox") return {v:"inbox"};
  return {v:"home"};
}
window.addEventListener("hashchange",()=>{S.route=parseHash();S.edit=null;S.pick=null;S.newArt=false;closeSide();render();window.scrollTo(0,0)});

/* ---------- render ---------- */
function render(){renderSide();renderMain();renderTop()}
function renderTop(){
  $("#modes").hidden=S.mode!=="gm";
  $("#qadd").hidden=!(S.mode==="gm"&&!S.preview);
  $("#menubtn").hidden=!(S.mode==="gm"||S.mode==="player");
  $("#m-gm").setAttribute("aria-pressed",String(!S.preview));
  $("#m-pl").setAttribute("aria-pressed",String(S.preview));
  $("#brandsub").textContent=S.mode==="gm"?(S.preview?"как видят игроки":"архив мастера"):"архив";
  $("#sync").textContent=S.busy?"сохраняю…":"";
}
function sortArts(list){return list.sort((a,b)=>(a.order||0)-(b.order||0)||title(a,true).localeCompare(title(b,true),"ru"))}
function renderSide(){
  const D=view();const q=S.q.trim().toLowerCase();
  const cur=S.route.v==="art"?S.route.id:null;
  let h='<ul class="navtop"><li><a href="#home"'+(S.route.v==="home"?' aria-current="page"':"")+'>Главная</a></li><li><a href="#timeline"'+(S.route.v==="tl"?' aria-current="page"':"")+'>Хронология</a></li><li><a href="#map"'+(S.route.v==="map"?' aria-current="page"':"")+'>Карта</a></li><li><a href="#glossary"'+(S.route.v==="gloss"?' aria-current="page"':"")+'>Глоссарий</a></li></ul>';
  for(const [c,cn] of CATS){
    const list=sortArts([...D.arts.values()].filter(a=>a.cat===c));
    if(!list.length) continue;
    h+="<h4>"+esc(cn)+"</h4>";
    const def=c==="people"&&D.gm?"Прочие":"";
    const gk=a=>a.group||def;
    const groups=!D.gm?[""]:[...new Set(list.map(gk))].sort((x,y)=>(x===""?-1:0)-(y===""?-1:0));
    for(const g of groups){
      const members=D.gm?list.filter(a=>gk(a)===g):list;
      if(g){
        h+="<h5>"+esc(g);
        if(D.gm){
          if(members[0].group) h+='<button class="tool gbtn" data-act="egrp" data-c="'+c+'" data-g="'+esc(members[0].group)+'" aria-label="Изменить группу">'+I.pen+"</button>";
        }
        h+="</h5>";
      }
      h+="<ul>";
      for(const a of members){
        const t=title(a,D.gm);
        const dot=D.gm?'<span class="dot'+(a.names.some(n=>n.o)?" on":"")+'" title="'+(a.names.some(n=>n.o)?"Видна игрокам":"Скрыта от игроков")+'"></span>':"";
        h+='<li><a href="#a-'+a.id.replace(/_/g,"-")+'"'+(cur===a.id?' aria-current="page"':"")+">"+dot+"<span>"+esc(t)+"</span></a></li>";
      }
      h+="</ul>";
    }
  }
  if(D.gm) h+='<button class="newbtn" data-act="newart">+ Новая статья</button>';
  $("#side").innerHTML=h;
}
function renderMain(){
  const m=$("#main");
  if(S.mode==="loading"){m.innerHTML='<div class="loading">Открываю архив…</div>';return}
  if(S.mode==="noaccess"){m.innerHTML='<div class="page empty"><h1 class="title">Архив закрыт</h1><p>Чтобы читать вики, войдите в claude.ai под аккаунтом, которому мастер открыл доступ, и обновите страницу.</p></div>';return}
  const D=view();
  if(S.newArt){m.innerHTML=newArtForm();return}
  if(S.q.trim()){m.innerHTML=searchView(D);return}
  if(S.route.v==="tl"){m.innerHTML=timelineView(D);return}
  if(S.route.v==="gloss"){m.innerHTML=glossaryView(D);glFilter();return}
  if(S.route.v==="map"){m.innerHTML='<div class="page"><div class="crumb">Эвия и Врата Балдура</div><h1 class="title">Карта</h1><div class="wip"><b>WIP</b><p>Карта в работе. Скоро здесь появится интерактивная карта с метками мест из вики.</p></div></div>';return}
  if(S.route.v==="art"){m.innerHTML=articleView(D,S.route.id);return}
  if(S.route.v==="leaks"&&D.gm){m.innerHTML=leaksView();return}
  if(S.route.v==="inbox"&&D.gm){m.innerHTML=inboxView();return}
  m.innerHTML=homeView(D);
}

function counts(){
  let tot=0,op=0;
  for(const a of S.arts.values()){const all=[a.lead,...a.sections.flatMap(s=>s.items)].filter(Boolean);tot+=all.length;op+=all.filter(i=>i.o).length}
  return {tot,op};
}
function recentOpened(D,n){
  const out=[];
  for(const a of D.arts.values()){
    for(const s of a.sections) for(const i of s.items) if(i.o&&i.ot) out.push({a,i});
    if(a.lead&&a.lead.o&&a.lead.ot) out.push({a,i:a.lead});
  }
  for(const e of D.tl.events||[]) if(e.o&&e.ot) out.push({e,i:e});
  return out.sort((x,y)=>y.i.ot-x.i.ot).slice(0,n);
}
function homeView(D){
  const arts=[...D.arts.values()];
  let h='<div class="page"><div class="hero"><div class="crumb">Сеттинг кампании · 325 г. СЗ / 1841 ДС</div><h1>Архив Эвии</h1>';
  if(D.gm){
    const c=counts();const vis=arts.filter(a=>a.names.some(n=>n.o)).length;
    h+='<p>Всё, что известно мастеру. Каждый факт — отдельная строка: <span style="color:var(--verd)">глаз</span> — игроки его видят, <span style="color:var(--secret)">замок</span> — нет. Нажмите на значок, чтобы открыть или скрыть факт.</p>';
    h+='<div class="stats"><div class="stat"><b>'+arts.length+'</b><span>статей</span></div><div class="stat"><b>'+vis+'</b><span>видны игрокам</span></div><div class="stat"><b>'+c.op+' / '+c.tot+'</b><span>фактов открыто</span></div><div class="stat"><b>'+(S.tl.events||[]).length+'</b><span>событий в хронологии</span></div></div>';
    const lk=scanLeaks().fix.length;
    if(inboxNew()) h+='<a class="leakbadge" href="#inbox" style="margin-right:16px">✉ Новых дополнений от игроков: '+inboxNew()+'</a>';
    if(lk) h+='<a class="leakbadge" href="#leaks">⚠ Скрытые имена в открытом: '+lk+' — проверить</a>';
    h+='<div class="bar"><i style="width:'+(c.tot?Math.round(c.op/c.tot*100):0)+'%"></i></div>';
    h+='<div class="legend"><span><span class="eye on" style="width:auto;height:auto">'+I.eye+'</span>открыто игрокам</span><span><span class="eye" style="width:auto;height:auto">'+I.lock+'</span>только мастеру</span><span><span class="dot on"></span>статья видна</span><span><span class="dot"></span>статья скрыта</span></div>';
  } else {
    h+='<p>Энциклопедия мира кампании: то, что ваши персонажи знают об империи, её церкви, людях и прошлом. Новые сведения появляются здесь по ходу игры.</p>';
  }
  h+="</div>";
  if(!arts.length){h+='<div class="empty">'+(D.gm?"Архив пока пуст.":"Мастер ещё ничего не открыл.")+"</div></div>";return h}
  const rec=recentOpened(D,8);
  if(rec.length){
    h+='<div class="recent"><h2>'+(D.gm?"Недавно открыто игрокам":"Недавно узнали")+'</h2><ul>';
    for(const r of rec){
      if(r.e) h+='<li><a href="#timeline">Хронология</a> — '+fmt(cut(plain(r.e.t)),D)+"</li>";
      else h+='<li><a href="#a-'+r.a.id.replace(/_/g,"-")+'">'+esc(title(r.a,D.gm))+"</a> — "+esc(cut(plain(r.i.t||"таблица")))+"</li>";
    }
    h+="</ul></div>";
  }
  h+='<div class="cats">';
  for(const [c,cn] of CATS){
    const list=sortArts(arts.filter(a=>a.cat===c));if(!list.length) continue;
    h+='<div class="cat"><h3>'+esc(cn)+'</h3><p>'+list.length+" "+plural(list.length,"статья","статьи","статей")+'</p><ul>';
    for(const a of list.slice(0,6)) h+='<li><a href="#a-'+a.id.replace(/_/g,"-")+'">'+esc(title(a,D.gm))+"</a></li>";
    if(list.length>6) h+='<li class="hint">и ещё '+(list.length-6)+"</li>";
    h+="</ul></div>";
  }
  return h+"</div></div>";
}
function cut(s,n=140){s=String(s);return s.length>n?s.slice(0,n-1)+"…":s}
function plural(n,a,b,c){const m=n%10,k=n%100;return m===1&&k!==11?a:m>=2&&m<=4&&(k<12||k>14)?b:c}

function eyeBtn(o,act,attrs,sm){return '<button class="eye'+(o?" on":"")+(sm?" sm":"")+'" data-act="'+act+'" '+attrs+' aria-label="'+(o?"Скрыть от игроков":"Открыть игрокам")+'" title="'+(o?"Видно игрокам — нажмите, чтобы скрыть":"Скрыто — нажмите, чтобы открыть игрокам")+'">'+(o?I.eye:I.lock)+"</button>"}
function isNew(i){return i.ot&&Date.now()-i.ot<NEWMS}

function quantum(a,i,D,kind){
  const attrs='data-a="'+a.id+'" data-q="'+i.id+'"';
  const editing=S.edit&&S.edit.q===i.id&&S.edit.a===a.id;
  if(!D.gm){
    return '<div class="q player'+(isNew(i)?" new":"")+'"><div class="qt">'+(i.table?tableHtml(i,a):"<p>"+fmt(i.t,D)+"</p>")+"</div></div>";
  }
  let body;
  if(editing&&!i.table) body=editorHtml(i.t,kind==="lead"?"Короткое описание статьи":"");
  else body=i.table?tableHtml(i,a):"<p>"+fmt(i.t,D)+"</p>";
  return '<div class="q '+(i.o?"open":"closed")+'">'+eyeBtn(i.o,"tq",attrs)+'<div class="qt">'+body+'</div><div class="qtools">'+
    (i.table||editing?"":'<button class="tool" data-act="eq" '+attrs+' aria-label="Изменить" title="Изменить">'+I.pen+"</button>")+
    (kind==="lead"||editing?"":'<button class="tool" data-act="uq" '+attrs+' aria-label="Выше" title="Поднять выше">'+I.up+'</button><button class="tool" data-act="dq" '+attrs+' aria-label="Удалить" title="Удалить">'+I.x+"</button>")+"</div></div>";
}
function editorHtml(t,hint){
  return '<div class="editor"><label class="sr" for="ed">Текст</label><textarea id="ed">'+esc(t)+'</textarea><div class="row"><button class="btn pri" data-act="save">Сохранить</button><button class="btn" data-act="cancel">Отмена</button><button class="btn" data-act="pick">Вставить ссылку</button><span class="hint">'+(hint?esc(hint)+" · ":"")+'**жирный** · [[id|текст]] — ссылка · Ctrl+Enter — сохранить</span></div>'+(S.pick!=null?pickerHtml():"")+"</div>";
}
function pickerHtml(){
  const q=S.pick.toLowerCase();
  const list=sortArts([...S.arts.values()].filter(a=>!q||a.names.some(n=>n.t.toLowerCase().includes(q)))).slice(0,30);
  return '<div><label class="sr" for="pickq">Найти статью</label><input id="pickq" placeholder="Найти статью…" value="'+esc(S.pick)+'"><div class="picker">'+list.map(a=>'<button data-act="ins" data-id="'+a.id+'">'+esc(a.names[0]?.t||a.id)+' <span class="hint">'+esc(CATN[a.cat]||"")+"</span></button>").join("")+"</div></div>";
}
function tableHtml(i,a){
  const tb=i.table,key=i.id,f=(S.tf[key]||"").toLowerCase();
  const big=tb.rows.length>20;
  const groupCol=big&&/Категория/i.test(tb.cols[0]);
  let rows=tb.rows.filter(r=>!f||r.join(" ").toLowerCase().includes(f));
  let h=big?'<label class="sr" for="tf-'+key+'">Фильтр таблицы</label><input class="tfilter" id="tf-'+key+'" data-tf="'+key+'" placeholder="Найти в таблице…" value="'+esc(S.tf[key]||"")+'">':"";
  h+='<div class="tw"><table><thead><tr>'+(groupCol?tb.cols.slice(1):tb.cols).map(c=>"<th>"+esc(c)+"</th>").join("")+"</tr></thead><tbody>";
  let last=null;
  for(const r of rows){
    if(groupCol){if(r[0]!==last){h+='<tr><td class="grp" colspan="'+(tb.cols.length-1)+'">'+esc(r[0])+"</td></tr>";last=r[0]}h+="<tr>"+r.slice(1).map(c=>"<td>"+esc(c)+"</td>").join("")+"</tr>"}
    else h+="<tr>"+r.map(c=>"<td>"+esc(c)+"</td>").join("")+"</tr>";
  }
  if(!rows.length) h+='<tr><td colspan="'+tb.cols.length+'" class="hint">Ничего не найдено.</td></tr>';
  return h+"</tbody></table></div>";
}
function imgSrc(asset){return window.__imgSrc?window.__imgSrc(asset):"/_blob/"+asset}

function articleView(D,id){
  const a=D.arts.get(id);
  if(!a) return '<div class="page empty"><h1 class="title">Статья не найдена</h1><p>'+(D.gm?"Возможно, её удалили.":"Её нет — или мастер ещё не открыл её.")+' <a href="#home">На главную</a></p></div>';
  const gm=D.gm;
  let h='<article class="page"><div class="crumb">'+esc(CATN[a.cat]||"")+(a.group?" · "+esc(a.group):"")+"</div>";
  if(gm&&S.edit&&S.edit.kind==="title"&&S.edit.a===a.id){
    h+='<div class="editor" style="margin:10px 0"><label class="sr" for="ed">Название</label><input id="ed" value="'+esc(a.names[0]?.t||"")+'"><div class="row"><button class="btn pri" data-act="save">Сохранить</button><button class="btn" data-act="cancel">Отмена</button></div></div>';
  } else h+='<h1 class="title">'+esc(title(a,gm))+"</h1>";
  // names
  if(gm){
    h+='<div class="names">';
    a.names.forEach((n,k)=>{

function zLabel(z){return z>=1?z+" г. СЗ":(1-z)+" г. до СЗ"}
function dateBlock(e){
  if(e.zf==null) return '<b>—</b><i>дата не установлена</i>';
  const ap=e.ap?"≈":"";
  const dr=ap+(e.zf+1516)+(e.zt!=null?"–"+(e.zt+1516):"")+" ДС";
  let zs;
  if(e.zt!=null){zs=e.zf>=1&&e.zt>=1?ap+e.zf+"–"+e.zt+" гг. СЗ":ap+zLabel(e.zf)+" – "+zLabel(e.zt)}
  else zs=ap+zLabel(e.zf);
  return "<b>"+esc(dr)+"</b><i>"+esc(zs)+"</i>"+(e.day?"<em>"+esc(e.day)+"</em>":"");
}
const MONTHS=[/хаммер|молот/,/алтуриак/,/чес/,/тарсах|тарсак/,/миртул/,/киторн/,/флеймрул|пламен/,/элеасис/,/элейнт/,/марпенот/,/уктар/,/найтал/];
function tlKey(e){
  const k=ERAS.indexOf(e.era);const d=String(e.day||"").toLowerCase();const mk=MONTHS.findIndex(r=>r.test(d));const dm=d.match(/\d+/);
  return [k<0?ERAS.length:k,e.zf??1e9,mk,dm?+dm[0]:0];
}
function tlSorted(evs){
  return evs.map((e,i)=>({e,i,k:tlKey(e)})).sort((x,y)=>x.k[0]-y.k[0]||x.k[1]-y.k[1]||x.k[2]-y.k[2]||x.k[3]-y.k[3]||x.i-y.i).map(x=>x.e);
}

function searchView(D){
  const q=S.q.trim().toLowerCase();
  const hl=s=>esc(s).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),m=>"<mark>"+m+"</mark>");
  const res=[];
  for(const a of D.arts.values()){
    let score=0,snip="";
    if(a.names.some(n=>n.t.toLowerCase().includes(q))) score+=10;
    const items=[a.lead,...a.sections.flatMap(s=>[{t:s.h},...s.items])].filter(Boolean).map(i=>i.table?{t:[...i.table.cols,...i.table.rows.flat()].join(" · ")}:i);
    for(const i of items){const p=plain(i.t);const k=p.toLowerCase().indexOf(q);if(k>=0){score+=1;if(!snip)snip=(k>40?"…":"")+p.slice(Math.max(0,k-40),k+110)}}
    if(score) res.push({a,score,snip});
  }
  res.sort((x,y)=>y.score-x.score);
  const evs=(D.tl.events||[]).filter(e=>plain(e.t).toLowerCase().includes(q));
  let h='<div class="page"><div class="crumb">Поиск</div><h1 class="title">«'+esc(S.q.trim())+'»</h1>';
  if(!res.length&&!evs.length) return h+'<div class="empty">Ничего не нашлось. Попробуйте другую форму слова.</div></div>';
  h+='<ul class="results" style="list-style:none;padding:0">';
  for(const r of res.slice(0,60)) h+='<li><a href="#a-'+r.a.id.replace(/_/g,"-")+'" data-act="clearq">'+hl(title(r.a,D.gm))+'</a> <span class="hint">'+esc(CATN[r.a.cat]||"")+"</span>"+(r.snip?'<div class="snip">'+hl(r.snip)+"</div>":"")+"</li>";
  for(const e of evs.slice(0,30)) h+='<li><a href="#timeline" data-act="clearq">Хронология</a> <span class="hint mono">'+(e.zf!=null?(e.zf+1516)+" ДС":"")+'</span><div class="snip">'+hl(cut(plain(e.t),200))+"</div></li>";
  return h+"</ul></div>";
}

let wq=Promise.resolve();
function queue(fn){S.busy++;renderTop();wq=wq.then(fn).catch(err=>{console.error(err);toast(errText(err))}).finally(()=>{S.busy--;renderTop();applyPending()});return wq}
function errText(e){
  const c=e&&e.code;
  if(c==="quota_exceeded") return "Хранилище вики заполнено — изменения не сохранились.";
  if(c==="invalid_argument") return "Сохранить не удалось: нет прав на изменение.";
  return "Не удалось сохранить. Проверьте соединение и повторите.";
}
function refsTo(id){const re=new RegExp("\\[\\["+id+"[|\\]]");const out=[];for(const b of S.arts.values()) if(re.test(JSON.stringify([b.lead,b.sections,b.images]))) out.push(b.id);return out}
function xnorm(v){
  // дополнения, записанные отдельно (xsections / xevents), вливаются в основной массив
  if(v&&Array.isArray(v.xsections)){const ids=new Set((v.sections||[]).map(s=>s.id));v.sections=(v.sections||[]).concat(v.xsections.filter(s=>!ids.has(s.id)));delete v.xsections}
  if(v&&Array.isArray(v.xevents)){const ev=(v.events||[]).slice();const ids=new Set(ev.map(e=>e.id));
    for(const x of v.xevents){if(ids.has(x.id)) continue;const k=ev.findIndex(e=>(e.ord||0)>(x.ord||0));if(k<0) ev.push(x);else ev.splice(k,0,x)}
    v.events=ev;delete v.xevents}
  return v;
}
function saveArt(a,prev,opts={}){
  a.updated=Date.now();
  const before=visSet(S.arts);
  S.arts.set(a.id,a);
  const after=visSet(S.arts);
  const flipped=[...new Set([...before,...after])].filter(x=>before.has(x)!==after.has(x));
  if(!opts.noUndo&&prev) S.undo={type:"art",prev};
  render();
  const targets=new Set([a.id]);
  for(const f of flipped) for(const r of refsTo(f)) targets.add(r);
  const tlToo=flipped.length>0;
  if(tlToo) for(const x of S.arts.keys()) targets.add(x);
  queue(async()=>{
    await S.db.collection("gm").doc(a.id).set(a);
    await syncPub([...targets],tlToo);
  });
}
async function syncPub(ids,tlToo){
  const vis=visSet(S.arts);
  for(const id of ids){
    const a=S.arts.get(id);const ref=S.db.collection("pub").doc(id);
    const p=a?pubOf(a,vis,S.arts):null;
    if(p) await ref.set(p); else await ref.delete();
  }
  if(tlToo) await S.db.collection("pub").doc("_timeline").set(pubTimeline(S.tl,vis,S.arts));
}
function saveTl(prev){
  if(prev) S.undo={type:"tl",prev};
  render();
  queue(async()=>{
    await S.db.collection("gm").doc("_timeline").set(S.tl);
    await S.db.collection("pub").doc("_timeline").set(pubTimeline(S.tl,visSet(S.arts),S.arts));
  });
}
async function rebuildAll(){
  toast("Пересобираю версию для игроков…");
  await queue(async()=>{
    const vis=visSet(S.arts);
    const existing=await S.db.collection("pub").get();
    let n=0;
    for(const a of S.arts.values()){const p=pubOf(a,vis,S.arts);if(p){await S.db.collection("pub").doc(a.id).set(p);n++}}
    for(const d of existing.docs) if(d.id!=="_timeline"&&!vis.has(d.id)) await S.db.collection("pub").doc(d.id).delete();
    await S.db.collection("pub").doc("_timeline").set(pubTimeline(S.tl,vis,S.arts));
    toast("Готово: игрокам видно "+n+" "+plural(n,"статья","статьи","статей")+".");
  });
}

function csvParse(t){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"') q=true;else if(c===","){row.push(f);f=""}else if(c==="\n"){row.push(f);rows.push(row);row=[];f=""}else if(c!=="\r") f+=c;
  }
  if(f||row.length){row.push(f);rows.push(row)}
  return rows;
}

async function loadInbox(quiet){
  const url=inboxUrl();if(!url){S.inbox=null;return}
  try{
    const r=await fetch(url+(url.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"});if(!r.ok) throw new Error(r.status);
    const rows=csvParse(await r.text());const head=(rows.shift()||[]).map(x=>x.toLowerCase());
    const col=(re,d)=>{const k=head.findIndex(h=>re.test(h));return k>=0?k:d};
    const cF=col(/кого/,1),cT=col(/чему|к ч/,2),cX=col(/помни|текст|что/,3);
    S.inbox=rows.filter(r=>r.some(Boolean)).map(r=>{const from=(r[cF]||"").trim(),to=(r[cT]||"").trim(),text=(r[cX]||"").trim(),when=(r[0]||"").trim();
      let h=0;for(const ch of when+from+text) h=(h*31+ch.charCodeAt(0))|0;
      const ids=[...to.matchAll(/\[([a-z0-9_-]+)\]/g)].map(m=>m[1]);
      return {id:"i"+(h>>>0).toString(36),when,from,to,text,art:ids[0]||"",item:ids[1]||""}}).reverse();
    S.inboxErr="";
  }catch(e){S.inbox=S.inbox||[];S.inboxErr="Не удалось загрузить ответы: проверьте ссылку на таблицу (Файл → Поделиться → Опубликовать в интернете → CSV)."}
  if(!quiet) renderMain();
}

function scanLeaks(){
  const vis=visSet(S.arts),T=hiddenTerms(S.arts,vis),auto=[],fix=[];
  const snip=(t,w)=>{const p=plain(t),k=p.indexOf(w),a=Math.max(0,k-60),b=Math.min(p.length,k+w.length+60);return (a?"…":"")+esc(p.slice(a,k))+"<mark>"+esc(w)+"</mark>"+esc(p.slice(k+w.length,b))+(b<p.length?"…":"")};
  const chk=(list,a,where,t,raw)=>{const l=leakIn(t,T);if(l) list.push({a,where,html:snip(raw??t,l.word),l})};
  for(const a of sortArts([...S.arts.values()])){
    if(!vis.has(a.id)) continue;
    const p=pubOf(a,vis,S.arts);
    for(const s of a.sections){
      if(!s.items.some(i=>i.o)) continue;
      if(!s.ph&&!pubHead(s,T)) chk(auto,a,"Заголовок раздела (у игроков — без заголовка)",s.h);
      if(s.ph) chk(fix,a,"Заголовок для игроков",s.ph);
    }
    for(const n of p.names) chk(fix,a,"Открытое имя",n.t);
    if(p.lead) chk(fix,a,"Описание",p.lead.t);
    for(const s of p.sections) for(const i of s.items){
      if(i.table) chk(fix,a,"Таблица · "+(s.h||"без заголовка"),[...i.table.cols,...i.table.rows.flat()].join(" · "));
      else chk(fix,a,"Факт · "+(s.h||"без заголовка"),i.t);
    }
    for(const im of p.images) chk(fix,a,"Подпись к картинке",im.cap);
  }
  for(const e of pubTimeline(S.tl,vis,S.arts).events) chk(fix,null,"Хронология"+(e.day?" · "+e.day:""),e.t);
  return {auto,fix};
}

          const add=(o[g]||[]).map(x=>String(x).trim()).filter(Boolean);if(!add.length) continue;

function poolFor(race){
  const a=namesArticle();const out={f:[],m:[],s:[]};if(!a) return out;
  const sec=a.sections.find(s=>s.h.trim().toLowerCase()===race);if(!sec) return out;
  for(const i of sec.items){
    if(i.table) continue;const t=String(i.t||"").replace(/\*\*/g,"");const k=t.indexOf(":");if(k<0) continue;
    const head=t.slice(0,k).toLowerCase();const g=/жен/.test(head)?"f":/муж/.test(head)?"m":/фамил/.test(head)?"s":null;if(!g) continue;
    out[g].push(...t.slice(k+1).split(",").map(x=>x.trim()).filter(Boolean));
  }
  return out;
}
function markov(list,n,avoid){
  const words=[...new Set(list.map(w=>w.toLowerCase()))];if(!words.length) return [];
  const O=2,T={};
  for(const w of words){const s="^".repeat(O)+w+"$";for(let i=0;i+O<s.length;i++){const k=s.slice(i,i+O);(T[k]=T[k]||[]).push(s[i+O])}}
  const lens=words.map(w=>w.length);const mn=Math.max(3,Math.min(...lens)-1),mx=Math.max(...lens)+2;
  const seen=new Set([...words,...avoid]);const res=[];
  for(let tries=0;tries<400&&res.length<n;tries++){
    let k="^".repeat(O),w="";
    while(w.length<mx+1){const nx=T[k];if(!nx) break;const c=nx[Math.floor(Math.random()*nx.length)];if(c==="$") break;w+=c;k=(k+c).slice(-O)}
    if(w.length<mn||w.length>mx||seen.has(w)) continue;
    if(/(.)\1\1/.test(w)||/[ьъ][ьъ]/.test(w)||/^[ьъы-]/.test(w)||/-$/.test(w)) continue;
    seen.add(w);res.push(w.split("-").map(p=>p?p[0].toUpperCase()+p.slice(1):p).join("-"));
  }
  return res;
}
function nameWords(t){return (String(t||"").match(/[A-Za-zА-Яа-яЁё'’-]{3,}/g)||[]).map(w=>w.toLowerCase().replace(/ё/g,"е"))}
function npcNameWords(){
  const all=new Set(),linked=new Set();const blob=new Map();
  for(const a of S.arts.values()) blob.set(a.id,JSON.stringify([a.lead,a.sections,a.images]));
  const tl=JSON.stringify(S.tl.events||[]);
  for(const a of S.arts.values()){
    if(a.cat!=="people") continue;
    const ws=a.names.flatMap(n=>nameWords(n.t));ws.forEach(w=>all.add(w));
    const re=new RegExp("\\[\\["+a.id+"[|\\]]");
    if(re.test(tl)||[...blob].some(([id,b])=>id!==a.id&&re.test(b))) ws.forEach(w=>linked.add(w));
  }
  return {all,linked};
}
function genNames(race,gender,withSurname,n=5){
  const P0=poolFor(race);const NW=npcNameWords();
  const free=x=>!nameWords(x).some(w=>NW.linked.has(w));
  const P={f:P0.f.filter(free),m:P0.m.filter(free),s:P0.s.filter(free)};
  const firsts=gender==="any"?[...P.f,...P.m]:(P[gender].length>=6?P[gender]:[...P[gender],...P[gender==="f"?"m":"f"]]);
  const pool=firsts.length?firsts:[...poolFor("люди").f,...poolFor("люди").m].filter(free);
  const avoid=[...NW.all,...[...S.arts.values()].flatMap(a=>a.names.map(x=>x.t.toLowerCase()))];
  let fn=markov(pool,n,avoid).filter(x=>!NW.all.has(x.toLowerCase().replace(/ё/g,"е")));
  const spare=pool.filter(x=>!nameWords(x).some(w=>NW.all.has(w))).sort(()=>Math.random()-.5);
  while(fn.length<n&&spare.length) fn.push(spare.pop());
  // составные фамилии («Каменная Кость», «аль-Рашид», «из Клана…») берём целиком, генерируем только из простых
  const simple=P.s.filter(x=>/^[А-ЯЁA-Z][^\s]*$/.test(x)&&!/^(Аль|Ибн|Бен)-/i.test(x));
  const gen=simple.length>=6?markov(simple,Math.ceil(n/2),avoid):[];
  const sn=withSurname&&P.s.length?[...gen,...P.s.slice().sort(()=>Math.random()-.5)].sort(()=>Math.random()-.5):[];
  return fn.map((f,i)=>({first:f,full:sn.length?f+" "+(Math.random()<.6&&sn[i]?sn[i]:sn[sn.length-1-i]||sn[0]):f}));
}
function addToPool(race,gender,name){
  ensureNamesArticle();const a0=namesArticle();if(!a0) return;
  const a=clone(a0);let sec=a.sections.find(s=>s.h.trim().toLowerCase()===race);
  if(!sec){sec={id:NAMES_ID+"-s"+uid(),h:race[0].toUpperCase()+race.slice(1),items:[]};a.sections.push(sec)}
  const g=gender==="any"?"m":gender;
  let it=sec.items.find(i=>!i.table&&new RegExp(GEN[g],"i").test(String(i.t||"")));
  if(!it){it={id:NAMES_ID+"-"+uid(),t:"**"+GEN[g]+":** ",o:false};sec.items.push(it)}
  const cur=String(it.t).replace(/^\*\*[^*]+\*\*\s*/,"").split(",").map(x=>x.trim()).filter(Boolean);
  if(cur.some(x=>x.toLowerCase()===name.toLowerCase())) return;
  cur.push(name);it.t="**"+GEN[g]+":** "+cur.join(", ");
  saveArt(a,null,{noUndo:true});toast("«"+name+"» добавлено в список имён.");
}

/* ---------- глоссарий ---------- */
const GLOSS_ID="geo_names";
const GLOSS_SEED={"id":"geo_names","cat":"meta","group":"","order":5,"names":[],"lead":null,"sections":[],"images":[]};
function glParse(t){
  t=String(t||"");let m=t.match(/^\*\*(.+?)\*\*\s*(?:\(([^)]*)\))?\s*—\s*(.*)$/);
  let en="",ru="",note="";
  if(m){en=m[1].trim();note=(m[2]||"").trim();ru=m[3].trim()}
  else{const k=t.indexOf(" — ");if(k>=0){ru=t.slice(0,k).trim();note=t.slice(k+3).trim()}else ru=t.trim()}
  const k2=ru.indexOf(" · ");if(k2>=0){note=(note?note+"; ":"")+ru.slice(k2+3).trim();ru=ru.slice(0,k2).trim()}
  const pm=ru.match(/^(.*?)\s*\(([^()]*)\)\s*$/);if(pm&&pm[1]){ru=pm[1].trim();note=(note?note+"; ":"")+pm[2].trim()}
  if(ru==="?") ru="";
  return {en,ru,note};
}
function glCompose(r){
  const ru=r.ru.trim()||"?";
  let t=r.en.trim()?"**"+r.en.trim()+"** — "+ru:ru;
  if(r.note.trim()) t+=" · "+r.note.trim();
  return t;
}
function glossaryView(D){
  const a=D.arts.get(GLOSS_ID);
  let h='<div class="page gl"><div class="crumb">Переводы названий</div><h1 class="title">Глоссарий</h1>';
  if(!a){
    if(D.gm){ensureGloss();return h+'<div class="empty">Создаю глоссарий…</div></div>'}
    return h+'<div class="empty">Мастер пока ничего не открыл в глоссарии.</div></div>';
  }
  const gm=D.gm;
  h+='<p class="hint" style="margin:0 0 10px">'+(gm?"Правьте прямо в таблице — сохраняется само, когда уходите из ячейки. Пустой перевод = ещё не переведено. Глаз — показать строку игрокам.":"Переводы названий мира.")+'</p>';
  h+='<div class="gl-tools"><label class="sr" for="glq">Найти</label><input id="glq" placeholder="Найти название…" value="'+esc(S.glq||"")+'">'+
     (gm?'<label class="qa-chk"><input type="checkbox" id="glmiss"'+(S.glmiss?" checked":"")+'> только без перевода</label>':"")+"</div>";
  a.sections.forEach((sec,si)=>{
    if(/^как пользоваться/i.test(sec.h)) return;
    const rows=sec.items.filter(i=>!i.table);
    if(!gm&&!rows.length) return;
    h+='<section class="sec gl-sec" data-sec="'+sec.id+'"><h2><span class="h">'+esc(sec.h)+'</span>'+(gm?'<span class="secbtns"><span class="hint mono">'+rows.filter(i=>glParse(i.t).ru).length+"/"+rows.length+"</span></span>":"")+'</h2><div class="tw"><table class="gl-t"><thead><tr><th>Оригинал</th><th>Перевод</th><th>Примечание</th>'+(gm?"<th></th>":"")+"</tr></thead><tbody>";
    for(const i of rows){
      const r=glParse(i.t);
      if(gm) h+='<tr data-row="'+i.id+'" class="'+(i.o?"":"gl-closed")+(r.ru?"":" gl-miss")+'"><td><input data-gl="en" value="'+esc(r.en)+'" aria-label="Оригинал"></td><td><input data-gl="ru" value="'+esc(r.ru)+'" placeholder="?" aria-label="Перевод"></td><td><input data-gl="note" value="'+esc(r.note)+'" aria-label="Примечание"></td><td class="gl-act">'+eyeBtn(i.o,"tq",'data-a="'+GLOSS_ID+'" data-q="'+i.id+'"',true)+'<button class="tool" data-glact="del" data-q="'+i.id+'" aria-label="Удалить строку">'+I.x+"</button></td></tr>";
      else h+='<tr data-row="'+i.id+'"><td>'+esc(r.en)+"</td><td>"+esc(r.ru||"—")+"</td><td>"+esc(r.note)+"</td></tr>";
    }
    h+="</tbody></table></div>"+(gm?'<div class="addrow" style="margin-left:0"><button data-glact="addrow" data-sec="'+sec.id+'">+ строка</button></div>':"")+"</section>";
  });
  if(gm) h+='<div class="addrow" style="margin-left:0;margin-top:22px"><button data-glact="addsec">+ раздел</button><a class="textbtn" href="#a-'+GLOSS_ID.replace(/_/g,"-")+'">открыть как статью</a></div>';
  return h+"</div>";
}
function ensureGloss(){if(S.arts.get(GLOSS_ID)||S._glossMaking) return;S._glossMaking=true;const a=clone(GLOSS_SEED);a.updated=Date.now();saveArt(a,null,{noUndo:true})}
function glFilter(){
  const q=(S.glq||"").trim().toLowerCase();
  document.querySelectorAll(".gl-t tbody tr").forEach(tr=>{
    const txt=[...tr.querySelectorAll("input")].map(x=>x.value).join(" ").toLowerCase()||tr.textContent.toLowerCase();
    const miss=tr.classList.contains("gl-miss");
    tr.hidden=!!(q&&!txt.includes(q))||(S.glmiss&&!miss);
  });
}
function glSaveRow(tr){
  S.glHold=Date.now();const qid=tr.dataset.row;const a0=S.arts.get(GLOSS_ID);if(!a0) return;
  const r={en:tr.querySelector('[data-gl="en"]').value,ru:tr.querySelector('[data-gl="ru"]').value,note:tr.querySelector('[data-gl="note"]').value};
  const a=clone(a0);const f=findItem(a,qid);if(!f) return;
  const t=glCompose(r);if(f.item.t===t) return;
  f.item.t=t;a.updated=Date.now();S.arts.set(a.id,a);tr.classList.toggle("gl-miss",!r.ru.trim());
  queue(async()=>{await S.db.collection("gm").doc(a.id).set(a);if(f.item.o) await syncPub([a.id],false)});
}
document.addEventListener("change",e=>{
  if(e.target.dataset&&e.target.dataset.gl){const tr=e.target.closest("tr");if(tr) glSaveRow(tr)}

});

document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.gl){e.preventDefault();e.target.blur()}});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-glact]");if(!b) return;
  const a0=S.arts.get(GLOSS_ID);if(!a0) return;const prev=clone(a0);const a=clone(a0);
  if(b.dataset.glact==="addrow"){const sec=a.sections.find(s=>s.id===b.dataset.sec);const id=GLOSS_ID+"-"+uid();sec.items.push({id,t:"?",o:false});saveArt(a,prev,{noUndo:true});
    setTimeout(()=>{const el=document.querySelector('tr[data-row="'+id+'"] [data-gl="en"]');if(el) el.focus()},60)}
  if(b.dataset.glact==="del"){const f=findItem(a,b.dataset.q);f.sec.items.splice(f.idx,1);saveArt(a,prev);toastUndo("Строка удалена.")}
  if(b.dataset.glact==="addsec"){a.sections.push({id:GLOSS_ID+"-s"+uid(),h:"Новый раздел",items:[]});saveArt(a,prev,{noUndo:true});toast("Раздел добавлен — переименовать его можно в статье.")}
});

/* ---------- exports ---------- */
async function exportPlayers(){
  const D=S.mode==="gm"?(()=>{const p=S.preview;S.preview=true;const d=view();S.preview=p;return d})():view();
  toast("Собираю файл…");
  const cache={};
  async function dataUrl(asset){
    if(cache[asset]) return cache[asset];
    try{const r=await fetch(imgSrc(asset));const b=await r.blob();cache[asset]=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(b)})}catch(e){cache[asset]=""}
    return cache[asset];
  }
  const fx=t=>esc(t).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\[\[([a-z0-9_]+)\|([^\]]*)\]\]/g,'<a href="#$1">$2</a>');
  let body="";
  for(const [c,cn] of CATS){
    const list=sortArts([...D.arts.values()].filter(a=>a.cat===c));if(!list.length) continue;
    body+="<h2 class=cat>"+esc(cn)+"</h2>";
    for(const a of list){
      body+='<article id="'+a.id+'"><h3>'+esc(pubTitle(a))+"</h3>";
      if(a.names.length>1) body+="<p class=al>"+a.names.slice(1).map(n=>esc(n.t)).join(" · ")+"</p>";
      if(a.lead) body+="<p class=ld>"+fx(a.lead.t)+"</p>";
      for(const im of a.images||[]){const u=await dataUrl(im.asset);if(u) body+='<figure><img src="'+u+'" alt=""><figcaption>'+fx(im.cap||"")+"</figcaption></figure>"}
      for(const s of a.sections){body+="<h4>"+esc(s.h)+"</h4><ul>";for(const i of s.items) body+="<li>"+(i.table?"<table><tr>"+i.table.cols.map(x=>"<th>"+esc(x)+"</th>").join("")+"</tr>"+i.table.rows.map(r=>"<tr>"+r.map(x=>"<td>"+esc(x)+"</td>").join("")+"</tr>").join("")+"</table>":fx(i.t))+"</li>";body+="</ul>"}
      body+="</article>";
    }
  }
  if((D.tl.events||[]).length){body+="<h2 class=cat>Хронология</h2><ul>";for(const e of D.tl.events) body+="<li><b>"+(e.zf!=null?(e.ap?"≈":"")+(e.zf+1516)+" ДС ("+zLabel(e.zf)+")":"")+(e.day?", "+esc(e.day):"")+"</b> — "+fx(e.t)+"</li>";body+="</ul>"}
  const html='<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Эвия — для игроков</title><style>body{font:16px/1.6 Georgia,serif;max-width:760px;margin:0 auto;padding:24px 16px;color:#1c2430;background:#f8f9f6}h1{font-weight:400;font-size:40px}h2.cat{margin-top:48px;border-bottom:2px solid #1c2430}h3{font-size:26px;margin:30px 0 4px;font-weight:400}h4{margin:14px 0 4px}.ld{font-size:18px}.al{color:#5d6672;margin:0}a{color:#1d7466}figure{margin:10px 0;max-width:360px}img{max-width:100%}figcaption{font-size:13px;color:#5d6672}table{border-collapse:collapse;font-size:14px}td,th{border:1px solid #cbd1ca;padding:4px 8px;text-align:left}</style></head><body><h1>Эвия</h1><p>Версия для игроков от '+new Date().toLocaleDateString("ru-RU")+".</p>"+body+"</body></html>";
  try{await S.downloads.save({filename:"evia-dlya-igrokov.html",data:html});}catch(err){if(err&&err.code!=="declined") toast("Не удалось сохранить файл.")}
}
async function backup(){
  const data=JSON.stringify({savedAt:new Date().toISOString(),articles:[...S.arts.values()],timeline:S.tl},null,1);
  try{await S.downloads.save({filename:"evia-arkhiv-mastera.json",data})}catch(err){if(err&&err.code!=="declined") toast("Не удалось сохранить файл.")}

(async function boot(){
  const cl=window.claude;
  if(!cl||!cl.use){S.mode="noaccess";render();return}
  const [user,db,dl]=await Promise.all([cl.use("user"),cl.use("db"),cl.use("downloads")]);
  S.downloads=dl;
  if(!db){S.mode="noaccess";render();return}
  S.db=db;
  const canEdit=user?await user.canEdit():false;
  if(canEdit){
    S.mode="gm";render();
    db.collection("gm").onSnapshot(snap=>{
      const m=new Map();let tl=null;
      for(const d of snap.docs){const v=xnorm(d.data());if(d.id==="_timeline") tl=v;else m.set(d.id,v)}
      S._pending={m,tl};applyPending();
      if(!S._ibInit){S._ibInit=true;loadInbox(true).then(()=>{if(S.route.v==="home") renderMain()})}
      if(!S._pubv&&tl&&(tl.pubv||0)<2&&!S.preview){S._pubv=true;const t2=clone(tl);t2.pubv=2;queue(()=>db.collection("gm").doc("_timeline").set(t2)).then(()=>rebuildAll())}
    },err=>{console.error(err);toast("Связь с архивом прервалась — обновите страницу.")});
    cl.use("assets").then(a=>{S.assets=a;if(S.route.v==="art") renderMain()});
  } else {
    S.mode="player";render();
    db.collection("pub").onSnapshot(snap=>{
      const m=new Map();let tl={events:[]};
      for(const d of snap.docs){const v=d.data();if(d.id==="_timeline") tl=v;else m.set(d.id,v)}
      S.pub=m;S.pubTl=tl;if(!S.edit) render();
    },err=>{console.error(err)});
  }
})();
})();
